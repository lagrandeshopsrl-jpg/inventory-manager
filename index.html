
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionale Negozio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Gestionale Negozio</h1>

<div class="topbar">
<input type="text" id="search" placeholder="Cerca barcode o prodotto..." autofocus onkeyup="renderProducts()">

<button onclick="toggleSelectProducts()" id="toggleSelectBtn">
Seleziona prodotti
</button>

<button onclick="deleteSelectedProducts()">
Elimina selezionati
</button>
</div>

<table>
<thead>
<tr>
<th></th>
<th>Barcode</th>
<th>Prodotto</th>
<th>Fornitore</th>
<th>Acquisto</th>
<th>Vendita</th>
<th>Azioni</th>
</tr>
</thead>

<tbody id="productTable"></tbody>
</table>

<div class="pagination">
<button onclick="prevPage()">⬅ Precedente</button>
<span id="pageInfo"></span>
<button onclick="nextPage()">Successiva ➡</button>
</div>

</div>

<div id="editModal" class="modal">

<div class="modal-content">

<h2>Modifica Prodotto</h2>

<input id="editBarcode" placeholder="Barcode">

<input id="editName" placeholder="Nome prodotto">

<input id="editSupplier" placeholder="Fornitore">

<input id="editBuy" placeholder="Prezzo acquisto">

<input id="editSell" placeholder="Prezzo vendita">

<div class="modal-buttons">
<button onclick="closeEditModal()">Annulla</button>
<button onclick="saveEditProduct()">Salva Modifiche</button>
</div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>

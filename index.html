<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div>
    <h1>Inventory Manager</h1>
    <p>Gestionale Magazzino / 库存管理</p>
  </div>
</div>

<div class="content">
<table>
<thead>
<tr>
<th>Barcode</th>
<th>Prodotto</th>
<th>Fornitore</th>
<th>Acquisto</th>
<th>Vendita</th>
<th>Azioni</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<div class="modal" id="editModal">
<div class="modal-box">
<div class="top">
<div>
<h2>Modifica Prodotto</h2>
<p>编辑产品</p>
</div>
<button class="close" onclick="closeModal()">✕</button>
</div>

<label>Barcode / 条形码</label>
<input id="barcode">

<label>Nome Prodotto / 产品名称</label>
<input id="name">

<label>Fornitore / 供应商</label>
<input id="supplier">

<label>Prezzo Acquisto (€)</label>
<input id="buy">

<label>Prezzo Vendita (€)</label>
<input id="sell">

<div class="buttons">
<button onclick="closeModal()">Annulla</button>
<button class="save" onclick="saveProduct()">Salva Modifiche</button>
</div>

</div>
</div>

<script src="app.js"></script>
</body>
</html>

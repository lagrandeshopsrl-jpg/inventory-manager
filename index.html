<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>Inventory Manager</h1>
  <p>Gestionale Magazzino / 库存管理</p>
</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Cerca barcode o prodotto..." autofocus onkeyup="renderProducts()">
  <button onclick="toggleSelectProducts()" id="toggleBtn">Seleziona prodotti</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th></th>
<th>Barcode</th>
<th>Prodotto</th>
<th>Fornitore</th>
<th>Acquisto</th>
<th>Vendita</th>
<th>Azioni</th>
</tr>
</thead>
<tbody id="productTable"></tbody>
</table>
</div>

<div id="editModal" class="modal">
<div class="modal-box">

<div class="modal-top">
<div>
<h2>Modifica Prodotto</h2>
<p>编辑产品</p>
</div>
<button class="close-btn" onclick="closeModal()">✕</button>
</div>

<label>Barcode / 条形码</label>
<input id="editBarcode">

<label>Nome prodotto / 产品名称</label>
<input id="editName">

<label>Fornitore / 供应商</label>
<input id="editSupplier">

<label>Prezzo acquisto (€)</label>
<input id="editBuy">

<label>Prezzo vendita (€)</label>
<input id="editSell">

<div class="modal-buttons">
<button onclick="closeModal()">Annulla</button>
<button class="save-btn" onclick="saveEdit()">Salva Modifiche</button>
</div>

</div>
</div>

<script src="app.js"></script>
</body>
</html>

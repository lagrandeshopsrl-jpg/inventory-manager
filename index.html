<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div>
    <h1>Inventory Manager</h1>
    <p>Gestionale Magazzino / 库存管理</p>
  </div>

  <div class="actions">
    <button>➕ Aggiungi / 添加</button>
    <button>⬆ Importa / 导入</button>
    <button>⚙ Impostazioni</button>
  </div>
</div>

<div class="toolbar">
  <input id="search" type="text" placeholder="Cerca per barcode o nome..." onkeyup="renderProducts()">
  <button onclick="toggleAll()">✔ Seleziona tutto</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th></th>
<th>Barcode</th>
<th>Nome Prodotto</th>
<th>Fornitore</th>
<th>Prezzo Acquisto</th>
<th>Prezzo Vendita</th>
<th>Azioni</th>
</tr>
</thead>
<tbody id="productTable"></tbody>
</table>
</div>

<div id="modal" class="modal">
<div class="modal-box">
<h2>Modifica Prodotto</h2>

<label>Barcode / 条形码</label>
<input id="barcode">

<label>Nome Prodotto / 产品名称</label>
<input id="name">

<label>Fornitore / 供应商</label>
<input id="supplier">

<label>Prezzo Acquisto (€)</label>
<input id="buy">

<label>Prezzo Vendita (€)</label>
<input id="sell">

<div class="modal-buttons">
<button onclick="closeModal()">Annulla</button>
<button class="save" onclick="saveProduct()">Salva Modifiche</button>
</div>

</div>
</div>

<script src="app.js"></script>
</body>
</html>

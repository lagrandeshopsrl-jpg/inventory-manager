
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <h1>Inventory Manager</h1>
    <p>Gestionale Prodotti</p>
</div>

<div class="toolbar">
    <input type="text" id="search" placeholder="Cerca barcode o prodotto..." onkeyup="renderProducts()" autofocus>
    <button onclick="toggleSelectProducts()" id="toggleBtn">Seleziona prodotti</button>
</div>

<div class="table-container">
<table>
<thead>
<tr>
<th></th>
<th>Barcode</th>
<th>Prodotto</th>
<th>Fornitore</th>
<th>Acquisto</th>
<th>Vendita</th>
<th>Azioni</th>
</tr>
</thead>
<tbody id="productTable"></tbody>
</table>
</div>

<div id="editModal" class="modal">
    <div class="modal-box">
        <h2>Modifica Prodotto</h2>

        <label>Barcode</label>
        <input id="editBarcode">

        <label>Nome prodotto</label>
        <input id="editName">

        <label>Fornitore</label>
        <input id="editSupplier">

        <label>Prezzo acquisto</label>
        <input id="editBuy">

        <label>Prezzo vendita</label>
        <input id="editSell">

        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeModal()">Annulla</button>
            <button class="save-btn" onclick="saveEdit()">Salva Modifiche</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>

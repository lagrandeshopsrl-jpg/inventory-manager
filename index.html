<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Manager Dropbox</title>
<style>
body{font-family:Arial;padding:20px;background:#f4f4f4}
input,button{padding:10px;margin:5px;border-radius:8px}
table{width:100%;background:white;border-collapse:collapse;margin-top:20px}
th,td{border:1px solid #ddd;padding:10px}
button{background:#0b63e5;color:white;border:none;cursor:pointer}
.top{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>

<h1>Inventory Manager Dropbox</h1>

<div class="top">
<input id="barcode" placeholder="Barcode">
<input id="name" placeholder="Prodotto">
<input id="supplier" placeholder="Fornitore">
<button onclick="addProduct()">Aggiungi</button>
<button onclick="backupDropbox()">☁ Backup Dropbox</button>
<button onclick="restoreDropbox()">☁ Ripristina Dropbox</button>
</div>

<input id="search" placeholder="Cerca barcode..." oninput="renderProducts()">

<input type="file" id="restoreDropboxFile" accept=".json" style="display:none" onchange="loadDropboxBackup(event)">

<table>
<thead>
<tr>
<th>Barcode</th>
<th>Prodotto</th>
<th>Fornitore</th>
<th>Azioni</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script>
let products = JSON.parse(localStorage.getItem('products') || '[]');

function saveStorage(){
 localStorage.setItem('products', JSON.stringify(products));
}

function addProduct(){
 const barcode=document.getElementById('barcode').value.trim();
 const name=document.getElementById('name').value.trim();
 const supplier=document.getElementById('supplier').value.trim();

 if(!barcode || !name){
   alert('Inserisci barcode e prodotto');
   return;
 }

 const existing = products.findIndex(p=>p.barcode===barcode);

 const p = {barcode,name,supplier};

 if(existing>=0) products[existing]=p;
 else products.unshift(p);

 saveStorage();
 renderProducts();

 document.getElementById('barcode').value='';
 document.getElementById('name').value='';
 document.getElementById('supplier').value='';
}

function deleteProduct(i){
 products.splice(i,1);
 saveStorage();
 renderProducts();
}

function renderProducts(){
 const search=document.getElementById('search').value.toLowerCase();
 const body=document.getElementById('tableBody');
 body.innerHTML='';

 products.forEach((p,i)=>{
   if(
     p.barcode.toLowerCase().includes(search) ||
     p.name.toLowerCase().includes(search) ||
     p.supplier.toLowerCase().includes(search)
   ){
     body.innerHTML += `
     <tr>
       <td>${p.barcode}</td>
       <td>${p.name}</td>
       <td>${p.supplier}</td>
       <td>
         <button onclick="deleteProduct(${i})">Elimina</button>
       </td>
     </tr>`;
   }
 });
}

/* ===== DROPBOX LOCAL BACKUP ===== */

function backupDropbox(){

  const data = {
    version: Date.now(),
    exportedAt: new Date().toISOString(),
    products: products
  };

  const json = JSON.stringify(data, null, 2);

  const blob = new Blob(
    [json],
    { type:'application/json' }
  );

  const a = document.createElement('a');

  a.href = URL.createObjectURL(blob);

  a.download = 'prodotti_backup.json';

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  alert('Backup Dropbox creato!');
}

function restoreDropbox(){
  document
    .getElementById('restoreDropboxFile')
    .click();
}

function loadDropboxBackup(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    try{

      const data = JSON.parse(e.target.result);

      products = data.products || [];

      localStorage.setItem(
        'products',
        JSON.stringify(products)
      );

      renderProducts();

      alert(
        'Backup Dropbox ripristinato!\n\n' +
        products.length +
        ' prodotti caricati.'
      );

    }catch(err){

      console.error(err);

      alert('Errore file backup');
    }
  };

  reader.readAsText(file);
}

renderProducts();
</script>

</body>
</html>
